# REQUIRED
# --cookies-from-browser firefox
--remote-components ejs:github


# DOWNLOAD OPTIONS
# resume partially downloaded files
--continue
# file name format
--output '~/music/%(title)s - %(artist)s.%(ext)s'


# FORMAT
# audio only
--extract-audio
# -f "opus"


# METADATA STUFF
--embed-thumbnail
--embed-metadata
--convert-thumbnail png
# resize thumbnail to squared
--ppa "ThumbnailsConvertor+FFmpeg_o:-c:v mjpeg -qmin 1 -qscale:v 1 -vf crop=\"min(iw\,ih)\":\"min(iw\,ih)\"" 
